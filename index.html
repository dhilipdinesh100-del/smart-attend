<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SmartAttend — Smart Attendance System</title>
  <link rel="icon" href="https://smart-attend-2-4jyp.onrender.com/static/favicon.ico" type="image/x-icon">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #app-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      z-index: 1;
      background-color: #0b0f19;
    }

    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0b0f19;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      color: #f3f4f6;
      text-align: center;
      padding: 20px;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      margin-bottom: 18px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }

    .loading-subtitle {
      font-size: 13.5px;
      color: #9ca3af;
      max-width: 320px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- Loading Screen Overlay -->
  <div id="loading-screen">
    <div class="brand-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
      </svg>
    </div>
    <div class="spinner"></div>
    <div class="loading-title">Loading SmartAttend...</div>
    <div class="loading-subtitle">Connecting to live cloud application.</div>
  </div>

  <!-- Full-Screen Embedded Application -->
  <iframe
    id="app-frame"
    src="https://smart-attend-2-4jyp.onrender.com"
    title="SmartAttend Application"
    allow="camera *; microphone *; fullscreen *; display-capture *; clipboard-read; clipboard-write;"
    allowfullscreen="true"
    loading="eager"
    onload="hideLoading()">
  </iframe>

  <script>
    function hideLoading() {
      const loader = document.getElementById('loading-screen');
      if (loader) {
        loader.classList.add('hidden');
      }
    }

    // Safety timeout in case onload is delayed or cached
    setTimeout(hideLoading, 3000);
  </script>
</body>
</html>
