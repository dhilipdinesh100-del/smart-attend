<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to SmartAttend...</title>
  
  <!-- Instant Meta Refresh Redirect -->
  <meta http-equiv="refresh" content="0; url=https://smart-attend-2-4jyp.onrender.com">
  <link rel="canonical" href="https://smart-attend-2-4jyp.onrender.com">

  <!-- Immediate JavaScript Redirect -->
  <script>
    window.location.replace("https://smart-attend-2-4jyp.onrender.com" + window.location.pathname.replace(/^\/smart-attend/, '') + window.location.search + window.location.hash);
  </script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --primary-start: #6366f1;
      --primary-end: #8b5cf6;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .redirect-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    .brand-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px auto;
      background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 8px;
    }

    p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .redirect-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 10px;
      transition: opacity 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
    }

    .redirect-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .target-url {
      display: block;
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="brand-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
      </svg>
    </div>
    <h1>Redirecting to SmartAttend</h1>
    <div class="spinner"></div>
    <p>Opening live application deployed on Render...</p>
    <a href="https://smart-attend-2-4jyp.onrender.com" class="redirect-btn">
      <span>Open Application Directly</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
    <span class="target-url">https://smart-attend-2-4jyp.onrender.com</span>
  </div>

  <script>
    // Fallback timer if instant replace was delayed
    setTimeout(function() {
      window.location.href = "https://smart-attend-2-4jyp.onrender.com";
    }, 1000);
  </script>
</body>
</html>
